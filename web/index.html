<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTA Transit Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230039a6'/%3E%3Ctext x='16' y='22.5' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='18' text-anchor='middle' fill='%23fff'%3EU%3C/text%3E%3C/svg%3E">
<script>
  // ?theme=dark|light picks the theme for this link (and remembers it), else the saved choice
  try {
    const q = new URLSearchParams(location.search).get("theme");
    if (q === "dark" || q === "light") localStorage.setItem("uta-theme", q);
    if (localStorage.getItem("uta-theme") === "dark") document.documentElement.dataset.theme = "dark";
  } catch {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
